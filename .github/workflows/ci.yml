name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: signdesk
          MYSQL_USER: signdesk
          MYSQL_PASSWORD: signdesk
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=20

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          DJANGO_SETTINGS_ENV: local
          DJANGO_SECRET_KEY: ci-test-secret-key-at-least-32-chars
          DJANGO_DEBUG: "true"
          MYSQL_DATABASE: signdesk
          # MySQL image only grants MYSQL_USER on MYSQL_DATABASE; Django needs
          # CREATE DATABASE for test_signdesk. Use root in CI (local Compose
          # applies deploy/mysql-init/01-grants.sql for the app user).
          MYSQL_USER: root
          MYSQL_PASSWORD: rootpass
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          CELERY_TASK_ALWAYS_EAGER: "true"
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          BASE_DOMAIN: signdeskcrm.test
          FRONTEND_PORT: "5173"
          FRONTEND_PROTOCOL: http
        run: python manage.py test

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_DOMAIN: signdeskcrm.com
