# Optional IP allowlist for Django /admin/
#
# By default this file allows all clients (open admin behind Traefik TLS +
# strong staff passwords). For production, replace with your office/VPN CIDRs:
#
#   allow 203.0.113.10;
#   allow 10.0.0.0/8;
#   deny all;
#
# Then reload nginx: docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
