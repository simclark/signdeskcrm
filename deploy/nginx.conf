# Internal app gateway — TLS is terminated by Traefik, not nginx.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Documents are never served from an open /media/ alias.
    # Authenticated PDFs: /api/media/...  Signing PDFs: /api/sign/<token>/document/

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
        # Do not set X-Tenant-Slug here — TenantMiddleware resolves the slug
        # from Host (e.g. demo.signdeskcrm.com → demo). Passing $host as the
        # slug breaks lookup (Unknown tenant).
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /var/www/static/;
    }

    # pdf.js (and other Vite ES modules) ship as .mjs. Alpine nginx's default
    # mime.types maps unknown extensions to application/octet-stream, which
    # browsers reject for module scripts ("could not load pdf").
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        types {
            application/javascript mjs;
        }
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /pdf.worker.min.js {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
