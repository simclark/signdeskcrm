# Internal app gateway — TLS is terminated by Traefik, not nginx.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    # Documents are never served from an open /media/ alias.
    # Authenticated PDFs: /api/media/...  Signing PDFs: /api/sign/<token>/document/

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Tenant-Slug $host;
    }

    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static/ {
        alias /var/www/static/;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
