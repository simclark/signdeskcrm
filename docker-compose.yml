services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: signdesk
      MYSQL_USER: signdesk
      MYSQL_PASSWORD: signdesk
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      # Host publish only — app still connects to mysql:3306 on the Docker network.
      # Default 3307 avoids ProgressPhase's host MySQL on 3306.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      # ProgressPhase does not publish Redis; 6379 is fine. Override if something else binds it.
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Host ports are configurable so SignDesk can run beside ProgressPhase
      # (ProgressPhase defaults to UI 8025). Container SMTP stays 1025 for EMAIL_HOST=mailpit.
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"

  api:
    build:
      context: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      # Host publish only — Vite proxy and Celery still reach api:8000 on the Docker network.
      # Default 8001 avoids ProgressPhase's API on 8000.
      - "${API_HOST_PORT:-8001}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: ./backend
    command: celery -A config worker -l INFO
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      api:
        condition: service_started

  beat:
    build:
      context: ./backend
    command: celery -A config beat -l INFO
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      - worker

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}
    environment:
      VITE_API_URL: http://api:8000
      VITE_BASE_DOMAIN: signdeskcrm.test
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      # Unique vs ProgressPhase (3001–3003 / Traefik :80).
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - api

volumes:
  mysql_data:
  media_data:
  frontend_node_modules:
