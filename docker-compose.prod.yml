name: signdesk

services:
  mysql:
    image: mysql:8.4
    profiles: ["builtin-mysql"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    environment:
      DJANGO_SETTINGS_ENV: production
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: celery -A config worker -l INFO
    env_file: .env
    environment:
      DJANGO_SETTINGS_ENV: production
      RUN_MIGRATIONS: "false"
    volumes:
      - media_data:/app/media
    depends_on:
      - api

  beat:
    build:
      context: ./backend
    command: celery -A config beat -l INFO
    env_file: .env
    environment:
      DJANGO_SETTINGS_ENV: production
      RUN_MIGRATIONS: "false"
    depends_on:
      - worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_DOMAIN: ${VITE_BASE_DOMAIN:-signdeskcrm.com}
    volumes:
      # Writable so entrypoint can refresh the shared SPA volume on each start.
      - frontend_dist:/usr/share/nginx/html

  # App gateway (HTTP only). Traefik terminates TLS and forwards here.
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_data:/var/www/static:ro
    depends_on:
      - api
      - frontend
    labels:
      - traefik.enable=true
      - traefik.http.services.signdesk.loadbalancer.server.port=80
      # Apex + any subdomain (Traefik v3 Go regexp).
      - traefik.http.routers.signdesk.rule=HostRegexp(`(?i)^([a-z0-9-]+\.)?${BASE_DOMAIN}$$`)
      - traefik.http.routers.signdesk.entrypoints=websecure
      - traefik.http.routers.signdesk.tls.certresolver=le
      - traefik.http.routers.signdesk.tls.domains[0].main=${BASE_DOMAIN}
      - traefik.http.routers.signdesk.tls.domains[0].sans=*.${BASE_DOMAIN}
      - traefik.http.routers.signdesk.service=signdesk

  traefik:
    # v3.6.1+ required for Docker Engine 29 (API negotiation; older Traefik hardcodes 1.24)
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN}
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=digitalocean
      # Wildcard + apex share _acme-challenge; DO NS lag often exceeds lego's 60s check.
      - --certificatesresolvers.le.acme.dnschallenge.propagation.disableChecks=true
      - --certificatesresolvers.le.acme.dnschallenge.propagation.delayBeforeChecks=90s
      - --certificatesresolvers.le.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    depends_on:
      - nginx

volumes:
  mysql_data:
  media_data:
  static_data:
  frontend_dist:
  traefik_letsencrypt:
